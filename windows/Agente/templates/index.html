<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEGIS | Your Windows AI Agent</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="dark-mode">
    <div class="bg-animation"></div>
    <div class="glow-sphere"></div>
    <div class="glass-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-robot"></i>
                <span>Aegis AI</span>
            </div>
            <nav class="modes">
                <button class="mode-btn active" data-mode="windows" title="Sistema">
                    <i class="fas fa-desktop"></i>
                    <span>Windows</span>
                </button>
                <button class="mode-btn" data-mode="programming" title="Código">
                    <i class="fas fa-code"></i>
                    <span>Coder</span>
                </button>
                <button class="mode-btn" data-mode="personal" title="Personal">
                    <i class="fas fa-user-tie"></i>
                    <span>Personal</span>
                </button>
                <button class="mode-btn" data-mode="gaming" title="Gaming">
                    <i class="fas fa-gamepad"></i>
                    <span>Gaming</span>
                </button>
            </nav>
            <div class="status-indicator">
                <div class="pulse"></div>
                <span>Ollama Online</span>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="content">
            <header class="top-bar">
                <div class="stats">
                    <div class="stat-item">
                        <span class="label">CPU</span>
                        <div class="progress-bar"><div id="cpu-bar" style="width: 0%"></div></div>
                        <span id="cpu-text" class="value">0%</span>
                    </div>
                    <div class="stat-item">
                        <span class="label">RAM</span>
                        <div class="progress-bar"><div id="ram-bar" style="width: 0%"></div></div>
                        <span id="ram-text" class="value">0%</span>
                    </div>
                </div>
                <div class="active-mode">
                    <span id="current-mode-display">WINDOWS ASSISTANT</span>
                </div>
            </header>

            <div id="chat-container" class="chat-container">
                <div class="message ai-msg">
                    <img src="{{ url_for('static', filename='ai_avatar_premium.png') }}" class="avatar">
                    <div class="bubble">Hola, soy Aegis. Tu sistema está bajo control. ¿Qué deseas hacer?</div>
                </div>
            </div>

            <footer class="input-area">
                <div class="input-wrapper">
                    <input type="text" id="user-input" placeholder="Escribe un comando o pregunta..." autocomplete="off">
                    <button id="send-btn"><i class="fas fa-paper-plane"></i></button>
                </div>
            </footer>
        </main>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
